{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "turbo-ea.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo-ea.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.ingress.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $svc := printf "%s-nginx" (include "turbo-ea.fullname" .) }}
    {{- $port := .Values.nginx.service.port }}
    {{- $hosts := .Values.ingress.hosts }}
    {{- if not $hosts }}
    {{- $hosts = list (dict "host" (include "turbo-ea.publicHost" .) "paths" (list (dict "path" "/" "pathType" "Prefix"))) }}
    {{- end }}
    {{- range $hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ $port }}
          {{- end }}
    {{- end }}
{{- end }}

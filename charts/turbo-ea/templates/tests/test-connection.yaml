apiVersion: v1
kind: Pod
metadata:
  name: {{ include "turbo-ea.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo-ea.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "turbo-ea.imagePullSecrets" . | nindent 2 }}
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: "{{ .Values.tests.image.registry }}/{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -ec
        - |
          base="http://{{ include "turbo-ea.fullname" . }}-nginx:{{ .Values.nginx.service.port }}"
          echo "GET $base/api/health"
          curl -fsS "$base/api/health"
          echo
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/")
          echo "GET $base/ -> $code"
          test "$code" = "200"

apiVersion: v1
kind: Service
metadata:
  name: {{ include "turbo-ea.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo-ea.componentLabels" (dict "root" . "component" "nginx") | nindent 4 }}
  {{- with (merge (dict) .Values.nginx.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - name: http
      port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "turbo-ea.selectorLabels" (dict "root" . "component" "nginx") | nindent 4 }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "turbo-ea.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo-ea.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "turbo-ea.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}

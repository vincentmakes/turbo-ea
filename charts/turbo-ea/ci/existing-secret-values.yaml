# Credentials come from a Secret the operator (or External Secrets) created.
publicUrl: https://ea.example.com:8443
existingSecret: turbo-ea-credentials
existingSecretKeys:
  secretKey: secret-key
  postgresPassword: db-password
postgresql:
  host: postgres.example.internal
allowedOrigins:
  - https://ea.example.com:8443
  - https://ea-alias.example.com
embedAllowedOrigins:
  - https://acme.atlassian.net
backend:
  persistence:
    existingClaim: turbo-ea-data
  extraEnvFrom:
    - secretRef:
        name: turbo-ea-smtp
  extraEnv:
    - name: SMTP_HOST
      value: smtp.example.com
global:
  imageRegistry: mirror.example.internal/ghcr
  imagePullSecrets:
    - mirror-pull

# Mutation-score floors, read by scripts/mutation/gate.py. Integers, percent.
# They ratchet upward only: a PR that lifts a measured score raises its floor
# here in the same diff; nothing ever lowers one (CLAUDE.md, Testing
# Conventions). Score = killed / (killed + survived); a mutant no test reaches
# counts as survived.

# Mutants on the lines a pull request adds or changes. Enforced by the
# Backend / Frontend / MCP Mutation Tests jobs on every PR, once at least
# `min_mutants` of them are in scope (below that a percentage is noise and the
# Test Plan answers for each survivor instead).
[diff]
backend = 60
frontend = 60
mcp = 60
min_mutants = 10

# The whole suite, measured by mutation-nightly.yml. A floor sits just under
# the measured score. The MCP server was measured in full on 2026-10-05:
# 39.8% at the baseline, 69.5% after the first test-hardening pass. The
# backend's baseline (60,921 mutants) completed on 2026-10-08 at 71.2%. The
# frontend's stays 0 until the nightly has finished re-measuring it with the
# page tests of #1180, then rises to it like every other floor.
[suite]
backend = 69
frontend = 0
mcp = 68

# Critical existing modules, enforced per file by the nightly once fully
# measured: the code where a weak test is a security or a money bug.
[modules]
# MCP server, re-measured 2026-10-05 after the test-hardening pass.
"mcp-server/turbo_ea_mcp/oauth.py" = 92       # redirect-URI validation (CWE-601)
"mcp-server/turbo_ea_mcp/logo_fetch.py" = 95  # SSRF guards on agent-chosen URLs
"mcp-server/turbo_ea_mcp/api_client.py" = 94  # chunked id lookups, origin + batch headers
"mcp-server/turbo_ea_mcp/identity.py" = 83
"mcp-server/turbo_ea_mcp/batches.py" = 95     # mutation-batch ledger and confirm tokens
"mcp-server/turbo_ea_mcp/config.py" = 98      # env parsing, the write kill switch

# Backend, measured file by file with mutmut_scope.py on 2026-10-05 after the
# test-hardening passes. Each floor sits about 2 points under its score.
"backend/app/core/security.py" = 95                   # JWTs, portal tokens, the res claim
"backend/app/core/permissions.py" = 98                # permission registry, type cells
"backend/app/core/encryption.py" = 98                 # Fernet secrets at rest
"backend/app/services/public_access.py" = 92          # SSO gate, visitor email, cookies
"backend/app/services/card_read_scope.py" = 92        # the one card read scope
"backend/app/services/attachment_validation.py" = 89  # uploads are what their bytes say
"backend/app/services/relation_orientation.py" = 96   # relations in their type's direction
"backend/app/services/calculation_engine.py" = 90     # the formula engine
"backend/app/services/risk_service.py" = 92           # risk register metrics and seeding
"backend/app/services/lifecycle.py" = 98              # does this card's cost count
"backend/app/services/fiscal_year.py" = 88
"backend/app/services/card_flags.py" = 95             # orphaned / stale / EOL coverage
"backend/app/services/extensions/cron.py" = 93        # extension job schedules
"backend/app/services/bpmn_flow_order.py" = 94        # the reading order of a process

# Authentication, measured 2026-10-08 after the security hardening pass. auth.py's
# route handlers are decorated, which mutmut never mutates, so its score is its
# helpers' (cookies, session issue, federated provisioning, emailed links).
"backend/app/services/proxy_auth_service.py" = 93     # trusted-proxy identity headers
"backend/app/services/sso_service.py" = 95            # SSO code exchange, id_token checks
"backend/app/services/email_backends/oauth.py" = 95   # mail OAuth tokens and their cache
"backend/app/api/v1/auth.py" = 94

# Audit and approval, measured 2026-10-08 after the rollback/approval pass.
"backend/app/services/rollback_service.py" = 97       # undoing a mutation batch
"backend/app/services/card_approval.py" = 97          # approval breaks and their fan-out

# Authorization, measured in full by the nightly on 2026-10-08 at 93.0%.
"backend/app/services/permission_service.py" = 91     # app, type-cell and stakeholder grants

# Frontend, measured with Stryker (static mutants ignored) on 2026-10-05.
"frontend/src/lib/returnPath.ts" = 98                # post-SSO open-redirect guards
"frontend/src/lib/linkify.ts" = 79                   # what in free text becomes a link
"frontend/src/lib/richHtml.ts" = 88                  # the one stored-HTML sanitiser
"frontend/src/lib/routePermissions.ts" = 86          # route gating (its table is static)
"frontend/src/lib/relationSort.ts" = 93
"frontend/src/lib/searchRank.ts" = 92
"frontend/src/lib/cardTree.ts" = 93
"frontend/src/lib/fiscalYear.ts" = 93
"frontend/src/components/grid/dragFill.ts" = 92
"frontend/src/features/reports/portfolioHelpers.ts" = 88

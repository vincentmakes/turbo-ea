<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/api/v1/settings/favicon" />
    <link rel="apple-touch-icon" href="/api/v1/settings/favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo EA</title>
    <!--
      `crossorigin` on the font stylesheets: without it their CSS rules are
      opaque to the page, so html-to-image (saved-report thumbnails, report
      exports) could not read the @font-face rules to embed Inter and the
      Material Symbols glyphs and logged a SecurityError per sheet. With it the
      rules are readable, the fonts embed, and a capture renders in the page's
      own fonts even on a machine without them installed. Google Fonts serves
      the CORS headers this needs.
    -->
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

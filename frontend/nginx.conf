# Frontend — internal static-file server only.
# All proxying, security headers and CSP live in the edge nginx config.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /drawio/ {
        alias /usr/share/nginx/drawio/;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The SPA entry point must always revalidate: it is the un-hashed file
        # that references the content-hashed bundles above, and with no header
        # at all Safari caches it heuristically — after a deploy, devices kept
        # loading the previous app for days. ETag revalidation makes every
        # navigation a cheap 304 instead.
        add_header Cache-Control "no-cache" always;
    }
}

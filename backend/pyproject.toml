[project]
name = "turbo-ea-backend"
version = "0.0.0"  # Placeholder — real version read from /VERSION at runtime
description = "Turbo EA - Enterprise Architecture Management API"
license = "FSL-1.1-MIT"
requires-python = ">=3.11"
dependencies = [
    # 0.136.3 silently added an undocumented `fastar` dependency to the
    # [standard] extra (MAL-2026-4750 — supply-chain / typosquat-shaped
    # namespace abuse). Pin away from that single release; re-evaluate
    # when upstream ships a clean version.
    "fastapi>=0.115.0,!=0.136.3",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    # Major-version caps below. The images install straight from this file with
    # no lockfile, and `docker-publish` rebuilds weekly on cron without a test
    # gate — so an unbounded floor lets a breaking major ship in a published
    # image with no code change and no test run against it. That is exactly how
    # the MCP SDK 2.0 break reached us. Raise a cap deliberately, after checking
    # the upstream changelog, not by deleting it.
    "bcrypt>=4.0.0,<6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0,<4",
    "httpx>=0.28.0",
    "email-validator>=2.1.0",
    "PyJWT>=2.9.0",
    "cryptography>=42.0.0,<51",
    "slowapi>=0.1.9",
    "simpleeval>=1.0.0",
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.0",
    # Amazon Bedrock provider (Converse API). Pure Python, so it installs on
    # the alpine image with no build deps; the weight is botocore's service
    # data. Only imported when an admin selects the Bedrock provider.
    "boto3>=1.35.0,<2",
    "turbo-ea-capabilities>=2026.5.11.505",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    # Mutation testing. Pinned exactly: scripts/mutation/mutmut_scope.py reads
    # its `results` / `show` output, so a bump is a deliberate, tested change.
    "mutmut==3.8.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
    "pip-tools>=7.4.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# The bundled data files (the principles catalogue, the brand-icon pack). The
# Docker image already gets them by copying the whole `app` tree, so this is
# what makes a plain `pip install backend/` correct too.
[tool.setuptools.package-data]
"app.services" = ["data/*.json", "data/*.pack"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"app/services/seed*.py" = ["E501"]
"app/services/turbolens_*.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
# Never collect the copy of the suite mutmut keeps under mutants/.
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# The metamodel seed and the demo datasets are data, not logic; seed_markers.py
# is logic and stays measured.
omit = ["app/services/seed.py", "app/services/seed_demo*.py"]
# Async SQLAlchemy runs every query on a greenlet. Without this, coverage.py
# stops tracing a request handler at its first `await db.execute()` and reports
# the rest of the function as never run — the suite measured 62% that way and
# 81% with the same tests once greenlets were traced (comments.py: 52% → 94%).
concurrency = ["greenlet", "thread"]
# CI measures the suite as shards on separate runners and combines the data
# files afterwards; relative paths keep the combine independent of where each
# runner checked the repository out.
relative_files = true

[tool.coverage.report]
# A floor just under the measured total, raised whenever a PR lifts it. CI
# fails the Backend Integration Tests job when the suite drops below it — the
# aggregate over the shard jobs, which each run with `--cov-fail-under=0`; the
# floor only means something on the combined data.
fail_under = 91
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Start permissive — tighten per-module as types are added
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "alembic.versions.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "app.services.seed",
    "app.services.seed_demo",
    "app.services.seed_demo_bpm",
]
ignore_errors = true

# Pre-existing type errors — remove modules as types are added
[[tool.mypy.overrides]]
module = [
    "app.main",
    "app.services.calculation_engine",
    "app.services.servicenow_service",
    "app.api.v1.auth",
    "app.api.v1.bookmarks",
    "app.api.v1.bpm_reports",
    "app.api.v1.bpm_workflow",
    "app.api.v1.cards",
    "app.api.v1.metamodel",
    "app.api.v1.reports",
    "app.api.v1.roles",
    "app.api.v1.settings",
    "app.api.v1.stakeholders",
    "app.api.v1.web_portals",
]
ignore_errors = true


# Mutation testing (CLAUDE.md, Testing Conventions, gate 3). Always run through
# scripts/mutation/mutmut_scope.py: it builds the shadow root the copied tests
# need to find the repository (scripts/mutation/shadow_root.py) and passes the
# mutant-name patterns that scope a run. Scope is never set with `only_mutate`:
# it is not part of mutmut's config fingerprint, so changing it keeps stale
# test-to-function stats and newly scoped functions read "no tests".
[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
# Data, not logic — the same files [tool.coverage.run] omits.
do_not_mutate = ["app/services/seed.py", "app/services/seed_demo*.py"]

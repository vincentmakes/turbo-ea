name: Daily security scan of published images

# Re-scans the *currently-published* `:latest` manifests on GHCR every day
# at 06:00 UTC. The `docker-publish.yml` workflow only re-scans when an image
# is rebuilt; this loop catches CVEs disclosed *after* the last push (which
# is exactly how CVE-2026-42945 / "NGINX Rift" landed against our deployed
# images without any signal).
#
# Findings flow to the Security tab as SARIF, same as the publish workflow.
# A failure on any CRITICAL finding triggers GitHub's standard scheduled-
# workflow-failure email to repo watchers.
#
# Manual run: `gh workflow run security-scan-published.yml`.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write
  # Lets the rebuild job below dispatch docker-publish.yml when a fixable
  # HIGH/CRITICAL turns up on a published image.
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan ${{ matrix.image }}:latest
    runs-on: ubuntu-latest
    outputs:
      # Matrix jobs all write into ONE output namespace and the last job to
      # finish wins -- so a clean image writing `false` would silently clobber
      # a dirty image's `true`. The step below therefore sets this output ONLY
      # when it finds something; a clean image leaves it unset, which cannot
      # overwrite. The result is a reliable "did ANY image report a fixable
      # finding" for the `rebuild` job's guard.
      needs_rebuild: ${{ steps.fixable.outputs.needs_rebuild }}
    strategy:
      fail-fast: false
      matrix:
        image: [db, backend, frontend, nginx, mcp-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Observe step — surfaces HIGH + CRITICAL, including unfixed advisories
      # (`ignore-unfixed: false`) so actively-exploited zero-days appear here
      # before an upstream fix is available. Never fails the job; the gate
      # step below is responsible for that.
      - name: Trivy scan (observe, HIGH + CRITICAL, incl. unfixed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          trivyignores: .github/trivy-allowlist

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: daily-trivy-${{ matrix.image }}

      # Gate step — fails the job on any CRITICAL with a fix available that
      # isn't on the allowlist. Mirrors the publish workflow's gate so the
      # two stay in lock-step.
      - name: Trivy gate (CRITICAL only, fixed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .github/trivy-allowlist

      # Docker Scout — second-opinion scanner. Observe-only here too.
      # Gated on the `DOCKERHUB_PAT` secret (Scout cannot run anonymously);
      # see the rationale in docker-publish.yml.
      - name: Docker Scout CVE scan
        if: always() && env.DOCKERHUB_PAT != ''
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          only-severities: critical,high
          sarif-file: scout-${{ matrix.image }}.sarif
          exit-code: false
          summary: true
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Upload Docker Scout SARIF to Security tab
        if: always() && hashFiles(format('scout-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scout-${{ matrix.image }}.sarif
          category: daily-scout-${{ matrix.image }}

      # Does this image carry a HIGH/CRITICAL that Alpine has ALREADY fixed?
      # `ignore-unfixed: true` is deliberate and differs from the observe step
      # above: observe keeps `false` so zero-days stay visible, but rebuilding
      # for something upstream has not patched yet only burns build minutes.
      - name: Trivy scan (fixable HIGH + CRITICAL, JSON)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          format: json
          output: trivy-fixable-${{ matrix.image }}.json
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          trivyignores: .github/trivy-allowlist

      - name: Decide whether :latest needs a rebuild
        id: fixable
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          file="trivy-fixable-${IMAGE}.json"
          if [ ! -s "$file" ]; then
            echo "No Trivy JSON for ${IMAGE} -- not requesting a rebuild."
            exit 0
          fi

          count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$file")"
          echo "${IMAGE}: ${count} fixable HIGH/CRITICAL finding(s)"

          if [ "$count" -eq 0 ]; then
            # Deliberately writes NO output. See the `outputs:` comment above:
            # emitting `false` here would clobber another image's `true`.
            exit 0
          fi

          {
            echo "### ${IMAGE}: ${count} fixable HIGH/CRITICAL finding(s)"
            echo
            jq -r '[.Results[]?.Vulnerabilities[]?]
                   | unique_by(.VulnerabilityID)[]
                   | "- `\(.VulnerabilityID)` \(.Severity) -- \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' "$file"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"

  # A fixable finding on a published image means `:latest` is simply stale --
  # the tag is only retagged on a release, a manual dispatch, or the weekly
  # cron, so without this an Alpine fix that lands on a Tuesday is not shipped
  # until the following Monday. That week-long window is how the util-linux
  # batch of 2026-09 came to sit in the Security tab.
  #
  # ONE dispatch for the whole matrix, not one per image: `needs: scan` waits
  # for every matrix job, so five affected images still trigger a single
  # rebuild of all five. No loop risk -- a workflow_dispatch run of
  # docker-publish.yml cannot re-trigger this workflow, which only fires on
  # `schedule` and `workflow_dispatch`.
  rebuild:
    name: Republish :latest with the fix
    needs: scan
    # `always()` so a red gate step (a CRITICAL with a fix) still rebuilds --
    # that is precisely the case that most needs shipping.
    if: always() && needs.scan.outputs.needs_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docker-publish.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh workflow run docker-publish.yml --repo "$REPO" --ref main

          {
            echo "## Rebuild dispatched"
            echo
            echo "A published image carries a HIGH/CRITICAL that upstream has already fixed,"
            echo "so \`docker-publish.yml\` was dispatched on \`main\`. That path is"
            echo "\`no-cache: true\` and retags \`:latest\`, so every runtime stage re-runs"
            echo "\`apk upgrade --no-cache\` against live Alpine repos."
          } >> "$GITHUB_STEP_SUMMARY"

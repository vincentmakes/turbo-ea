name: Publish Helm Chart

# Packages charts/turbo-ea with the version stamped from /VERSION and pushes it
# to GHCR as an OCI artifact:
#   oci://ghcr.io/vincentmakes/turbo-ea/charts/turbo-ea
# Only release tags publish — a chart version must be unique, and `main` moves
# without a version bump. Pre-release tags (v2.141.0-rc.1) publish as semver
# pre-releases, which `helm install --version 2.141.0` never resolves to.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      sign_only_version:
        description: >-
          Sign an ALREADY PUBLISHED chart version instead of packaging a new
          one (e.g. 2.141.0, whose first run pushed the chart and then failed
          at Sign chart before #1113). Leave empty for a normal publish.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Package, push and sign chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    env:
      CHART_DIR: charts/turbo-ea
      OCI_REPO: oci://ghcr.io/${{ github.repository }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # /VERSION is the single source of truth; the tag must agree with it so a
      # chart never claims a version its images do not carry.
      - name: Resolve version
        id: version
        if: ${{ !inputs.sign_only_version }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.event_name }}" = "push" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint
        if: ${{ !inputs.sign_only_version }}
        run: helm lint --strict "$CHART_DIR" -f "$CHART_DIR/ci/minimal-values.yaml"

      - name: Package
        if: ${{ !inputs.sign_only_version }}
        run: |
          helm package "$CHART_DIR" \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist
          helm show chart "dist/turbo-ea-${{ steps.version.outputs.version }}.tgz"

      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # cosign reads Docker's credential store, not Helm's; without this the
      # signature upload is refused with UNAUTHORIZED after a successful push.
      - name: Log in to GHCR (Docker credential store)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: ${{ !inputs.sign_only_version }}
        run: |
          helm push "dist/turbo-ea-${{ steps.version.outputs.version }}.tgz" "$OCI_REPO" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log | tr -d '[:space:]')"
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # A normal run signs the digest `helm push` just printed. A
      # `sign_only_version` dispatch signs an already-published tag instead —
      # cosign resolves and prints the digest itself, and `--yes` skips the
      # tag-not-digest prompt (imagetools cannot inspect a Helm artifact's
      # media type, and `crane` would be one more action to pin for a one-off).
      - name: Resolve signing target
        id: target
        env:
          CHART_REF: ghcr.io/${{ github.repository }}/charts/turbo-ea
          SIGN_ONLY_VERSION: ${{ inputs.sign_only_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -n "$SIGN_ONLY_VERSION" ]; then
            echo "ref=${CHART_REF}:${SIGN_ONLY_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${CHART_REF}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      # Same keyless OIDC signing as the container images (docker-publish.yml);
      # verification recipe in .github/SECURITY_PIPELINE.md. The signature is a
      # Sigstore bundle (cosign 3), readable by cosign ≥ 2.6 — see the note
      # above the sign step in docker-publish.yml, and keep the floor below in
      # step with it and with docs/admin/supply-chain.md.
      - name: Sign chart
        env:
          TARGET: ${{ steps.target.outputs.ref }}
        run: cosign sign --yes "${TARGET}"

      - name: Install cosign at the documented minimum client version
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3
          install-dir: ${{ runner.temp }}/cosign-floor

      - name: Verify signature with the documented minimum client
        env:
          TARGET: ${{ steps.target.outputs.ref }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/helm-publish.yml@${{ github.ref }}
        run: |
          "${RUNNER_TEMP}/cosign-floor/cosign" version
          "${RUNNER_TEMP}/cosign-floor/cosign" verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${TARGET}"

      - name: Upload packaged chart
        if: ${{ !inputs.sign_only_version }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-ea-chart-${{ steps.version.outputs.version }}
          path: dist/*.tgz
          if-no-files-found: error

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo-ea-mcp"
version = "0.0.0"
description = "MCP server for Turbo EA — AI tool access to EA data plus artifact upload (cards, relations, diagrams)"
license = "FSL-1.1-MIT"
requires-python = ">=3.11"
dependencies = [
    # Capped below 2.0: the SDK's 2.0 release deleted the whole
    # `mcp.server.fastmcp` subpackage, which `server.py` is built on. The
    # unbounded floor let `pip install .` resolve to 2.0.0, breaking both the
    # CI test job and the mcp-server image (the Dockerfile installs unpinned).
    # Lift the cap only together with a port off FastMCP.
    "mcp>=1.9.0,<2",
    "httpx>=0.28.0",
    # Declared rather than leaned on transitively via `mcp`: `models.py`
    # depends on it directly for the typed tool schema.
    "pydantic>=2,<3",
    "pyjwt>=2.9.0",
    # Same reasoning as the cap above: starlette crossed 0.x -> 1.x, and this
    # image installs unpinned at build time.
    "starlette>=0.45.0,<2",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    # Mutation testing; pinned exactly for the reason given in backend/pyproject.toml.
    "mutmut==3.8.0",
]

[tool.pytest.ini_options]
# Never collect the copy of the suite mutmut keeps under mutants/.
testpaths = ["tests"]

[tool.coverage.run]
source = ["turbo_ea_mcp"]
omit = ["turbo_ea_mcp/__main__.py"]

[tool.coverage.report]
# A floor just under the measured total (90% on 2026-10-09); raise it in any
# PR that lifts the number, never lower it.
fail_under = 88
show_missing = true
skip_covered = true

# Mutation testing (CLAUDE.md, Testing Conventions, gate 3). Always run through
# scripts/mutation/mutmut_scope.py, for the reasons in backend/pyproject.toml.
[tool.mutmut]
source_paths = ["turbo_ea_mcp"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
do_not_mutate = ["turbo_ea_mcp/__main__.py"]
